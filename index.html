<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>園藝技藝競賽識別線上練習</title>
<style>
  :root{ --green:#2e7d32; --green-d:#1b5e20; --bg:#f4f7f4; --card:#fff; --line:#dfe6df; --ok:#2e7d32; --bad:#c62828; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;background:var(--bg);color:#222}
  header{background:var(--green);color:#fff;padding:14px 16px;text-align:center}
  header h1{margin:0;font-size:20px} header .ver{font-size:12px;opacity:.85;margin-top:4px}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  button{font-family:inherit;cursor:pointer}
  .btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:15px}
  .btn:hover{background:var(--green-d)} .btn.ghost{background:#eef3ee;color:var(--green-d)} .btn.sm{padding:6px 12px;font-size:13px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  select,input{font-family:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px}
  .modes label{margin-right:16px;font-size:15px}
  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:10px 0}
  .catbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;user-select:none}
  .catbox:hover{border-color:var(--green)} .catbox input{width:17px;height:17px;accent-color:var(--green)}
  .catbox .cnt{margin-left:auto;color:#888;font-size:12px} .catbox.on{background:#e8f5e9;border-color:var(--green)}
  .qimg{width:100%;border:3px solid var(--green);border-radius:10px;display:block;background:#eee;object-fit:contain;max-height:440px}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;font-size:15px}
  .opt:hover{border-color:var(--green)} .opt.sel{border-color:var(--green);background:#e8f5e9;font-weight:bold}
  .fillbox{width:100%;font-size:18px;padding:12px;text-align:center;border:2px solid var(--green)}
  .nav{display:flex;justify-content:space-between;margin-top:10px;gap:8px}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
  .grid button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 0;font-size:13px}
  .grid button.done{background:#c8e6c9;border-color:var(--green)} .grid button.cur{outline:2px solid var(--green)}
  .bar{display:flex;justify-content:space-between;font-size:14px;color:var(--green-d);font-weight:bold;margin-bottom:8px}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{border:1px solid var(--line);padding:6px;text-align:center}
  .ok{color:var(--ok);font-weight:bold}.bad{color:var(--bad);font-weight:bold}
  .hide{display:none}.center{text-align:center}
  .big{font-size:34px;font-weight:bold;color:var(--green)} small{color:#666}
  .loading{padding:30px;text-align:center;color:#666}
</style>
</head>
<body>
<header>
  <h1>&#127793; 園藝技藝競賽識別線上練習</h1>
  <div class="ver" id="ver"></div>
</header>
<div class="wrap">
  <div id="loadView" class="card loading">題庫載入中…</div>

  <div id="startView" class="card hide">
    <div class="row"><label>考生姓名／代號：<input id="name" placeholder="請輸入"></label></div>

    <p style="margin:14px 0 4px"><strong>作答模式：</strong></p>
    <div class="modes">
      <label><input type="radio" name="mode" value="choice" checked> 選擇題（ABCD 四選一）</label>
      <label><input type="radio" name="mode" value="fill"> 填空題（自行輸入答案）</label>
    </div>

    <p style="margin:14px 0 4px"><strong>出題類別（可複選）：</strong></p>
    <div class="row">
      <button class="btn ghost sm" id="allBtn">全選</button>
      <button class="btn ghost sm" id="noneBtn">全不選</button>
      <span id="selCnt" style="color:var(--green-d);font-weight:bold"></span>
    </div>
    <div class="cats" id="cats"></div>

    <div class="row" style="margin-top:6px">
      <label>題數：<input id="numInp" type="number" value="50" min="1" style="width:90px"> 題</label>
      <label>作答時間：<select id="timeSel">
        <option value="20">20 分鐘</option><option value="30">30 分鐘</option><option value="50" selected>50 分鐘</option>
      </select></label>
    </div>
    <p><small>共 50 題，每題 2 分：答對 +2、答錯 −2、未作答 −2，滿分 100 分、最低 0 分，作答時間 50 分鐘。</small></p>
    <p style="margin-top:12px"><button class="btn" id="startBtn">開始測驗</button></p>
  </div>

  <div id="quizView" class="hide">
    <div class="card">
      <div class="bar"><span id="who">—</span><span id="prog">0 / 0</span><span id="timer">50:00</span></div>
      <img id="qimg" class="qimg" alt="題目圖片">
      <h3 id="qtitle" class="center">第 1 題</h3>
      <div id="opts"></div>
      <div class="nav">
        <button class="btn ghost" id="prevBtn">← 上一題</button>
        <button class="btn ghost" id="nextBtn">下一題 →</button>
        <button class="btn" id="submitBtn">交卷</button>
      </div>
    </div>
    <div class="card"><strong>題目導覽</strong><div class="grid" id="navGrid"></div></div>
  </div>

  <div id="resultView" class="hide">
    <div class="card center">
      <h2>測驗結果</h2>
      <p>姓名／代號：<strong id="rName">—</strong>　模式：<span id="rMode"></span></p>
      <div class="big"><span id="rScore">0</span> 分</div>
      <p>滿分 <strong id="rFull">0</strong>　答對 <span class="ok" id="rRight">0</span>　答錯 <span class="bad" id="rWrong">0</span>　未作答 <span id="rBlank">0</span></p>
      <div class="row" style="justify-content:center">
        <button class="btn ghost" id="homeBtn">回首頁</button>
        <button class="btn" id="retryBtn">再測一次</button>
      </div>
    </div>
    <div class="card"><strong>&#11088; 答題明細（錯題以紅色標示）</strong>
      <table id="reviewTbl"><thead><tr><th>#</th><th>題圖</th><th>你的答案</th><th>正確答案</th><th>判定</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
/* ====== 設定區:上線時填這兩項 ====== */
const CONFIG = {
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-owWDA9YaaXEcMTeRr_LLkzdO9xHSyVEkYOV3U33xHGBGvN3c9VesbHq6w8SyWIJEf6trMD6XOfZJ/pub?output=csv",  // 你的 Google 試算表 CSV
  IMG_BASE: "選手圖片/"        // 圖片資料夾(GitHub 上的相對路徑),結尾要有 /
};
/* ==================================== */

let DATA=null, quiz=[], cur=0, timer=null, remain=0, MODE='choice';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s==null?'':String(s)).trim();}
/* 副檔名/大小寫自動容錯:找不到就依序改試 .JPG/.jpeg/.png… */
function imgErr(){var img=this;var i=(img._i||0)+1;img._i=i;if(img._cands&&i<img._cands.length){img.src=img._cands[i];}else{img.onerror=null;}}
function attachImg(img, src){var d=src.lastIndexOf('.'),sl=src.lastIndexOf('/');var base=(d>sl)?src.slice(0,d):src;
  img._cands=[base+'.jpg',base+'.JPG',base+'.jpeg',base+'.JPEG',base+'.png',base+'.PNG',base+'.webp'];img._i=0;img.onerror=imgErr;img.src=img._cands[0];}
function makeOptions(item, pool){
  const same=pool.filter(p=>p.cat===item.cat&&p.answer!==item.answer);
  const oth=pool.filter(p=>p.cat!==item.cat&&p.answer!==item.answer);
  const u=a=>[...new Set(a.map(x=>x.answer))];
  let d=shuffle(u(same)); if(d.length<3)d=d.concat(shuffle(u(oth)));
  d=[...new Set(d)].slice(0,3); return shuffle([item.answer,...d]);
}
function parseCSV(text){
  const rows=[]; let i=0,f='',row=[],q=false;
  while(i<text.length){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false;} else f+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c==='\r'){} else f+=c; }
    i++;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.length&&r.some(x=>norm(x)));
}
function fromCSV(text){
  const rows=parseCSV(text); const head=rows[0].map(norm);
  const idx=n=>head.findIndex(h=>h.indexOf(n)>=0);
  const iF=idx('圖片檔名')>=0?idx('圖片檔名'):1, iN=idx('植物名稱')>=0?idx('植物名稱'):2,
        iC=idx('類別代碼')>=0?idx('類別代碼'):3, iL=idx('類別名稱')>=0?idx('類別名稱'):4;
  const items=[],cats={};
  for(let r=1;r<rows.length;r++){const row=rows[r];
    let fn=norm(row[iF]); if(!fn)continue;
    const cat=norm(row[iC])||'其他'; const lab=norm(row[iL])||cat;
    if(!cats[cat])cats[cat]=lab;
    items.push({id:r,file:fn,answer:norm(row[iN]),cat:cat});
  }
  return {title:'園藝技藝競賽識別線上練習',version:'Google試算表',examMinutes:50,defaultNum:50,categories:cats,items:items};
}
async function load(){
  try{
    if(CONFIG.SHEET_CSV_URL){ const t=await (await fetch(CONFIG.SHEET_CSV_URL)).text(); DATA=fromCSV(t); }
    else { DATA=await (await fetch('questions.json')).json(); }
  }catch(e){
    try{ DATA=await (await fetch('questions.json')).json(); }
    catch(e2){ document.getElementById('loadView').textContent='題庫載入失敗，請確認 questions.json 或試算表網址。'; return; }
  }
  DATA.items.forEach(it=>{ it.img = CONFIG.IMG_BASE + it.file; });
  document.getElementById('ver').textContent='ver '+DATA.version+'　共 '+DATA.items.length+' 題';
  if(DATA.defaultNum) document.getElementById('numInp').value=DATA.defaultNum;
  const box=document.getElementById('cats');
  for(const k in DATA.categories){
    const n=DATA.items.filter(i=>i.cat===k).length;
    const lab=document.createElement('label'); lab.className='catbox';
    lab.innerHTML='<input type="checkbox" value="'+k+'"><span>'+k+' '+DATA.categories[k]+'</span><span class="cnt">'+n+'張</span>';
    box.appendChild(lab);
  }
  box.addEventListener('change',updateSel); updateSel();
  document.getElementById('loadView').classList.add('hide');
  document.getElementById('startView').classList.remove('hide');
}
function selectedCats(){return [...document.querySelectorAll('#cats input:checked')].map(c=>c.value);}
function updateSel(){
  document.querySelectorAll('#cats .catbox').forEach(b=>b.classList.toggle('on',b.querySelector('input').checked));
  const sel=selectedCats(); const pool=sel.length?DATA.items.filter(i=>sel.includes(i.cat)):[];
  document.getElementById('selCnt').textContent=sel.length?('已選 '+sel.length+' 類，可出題 '+pool.length+' 張'):('未選 = 全部題庫（'+DATA.items.length+' 張）');
}
function start(){
  MODE=document.querySelector('input[name=mode]:checked').value;
  const sel=selectedCats();
  let pool=sel.length?DATA.items.filter(i=>sel.includes(i.cat)):DATA.items;
  if(!pool.length){alert('請至少選一個類別');return;}
  let num=parseInt(document.getElementById('numInp').value)||75; num=Math.min(num,pool.length);
  quiz=shuffle(pool).slice(0,num).map(it=>({item:it,options:MODE==='choice'?makeOptions(it,DATA.items):null,picked:null}));
  cur=0; document.getElementById('who').textContent=document.getElementById('name').value||'考生';
  show('quizView'); buildGrid(); render();
  remain=(parseInt(document.getElementById('timeSel').value)||30)*60; tick(); timer=setInterval(tick,1000);
}
function tick(){const m=String(Math.floor(remain/60)).padStart(2,'0'),s=String(remain%60).padStart(2,'0');
  document.getElementById('timer').textContent=m+':'+s; if(remain<=0){clearInterval(timer);finish();return;} remain--;}
function buildGrid(){const g=document.getElementById('navGrid');g.innerHTML='';
  quiz.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{cur=i;render();};g.appendChild(b);});}
function refreshGrid(){[...document.getElementById('navGrid').children].forEach((b,i)=>{b.className='';const p=quiz[i].picked;if(p!=null&&norm(p)!=='')b.classList.add('done');if(i===cur)b.classList.add('cur');});}
function render(){const q=quiz[cur];
  document.getElementById('prog').textContent=(cur+1)+' / '+quiz.length;
  document.getElementById('qtitle').textContent='第 '+(cur+1)+' 題';
  const img=document.getElementById('qimg');img.alt='題目'+(cur+1);attachImg(img,q.item.img);
  const box=document.getElementById('opts');box.innerHTML='';
  if(MODE==='choice'){const L=['A','B','C','D'];
    q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='opt'+(q.picked===opt?' sel':'');
      b.textContent=L[i]+'. '+opt;b.onclick=()=>{q.picked=opt;render();refreshGrid();};box.appendChild(b);});
  }else{
    const inp=document.createElement('input');inp.className='fillbox';inp.placeholder='請輸入植物名稱';
    inp.value=q.picked||''; inp.oninput=()=>{q.picked=inp.value;refreshGrid();};
    inp.onkeydown=(e)=>{if(e.key==='Enter'&&cur<quiz.length-1){cur++;render();}};
    box.appendChild(inp); setTimeout(()=>inp.focus(),0);
  }
  refreshGrid();
}
function finish(){clearInterval(timer);
  let right=0,wrong=0,blank=0; const tb=document.querySelector('#reviewTbl tbody');tb.innerHTML='';
  quiz.forEach((q,i)=>{
    const ans=norm(q.item.answer), got=norm(q.picked);
    let ok=false,stat;
    if(got===''){blank++;stat='blank';}
    else if(got===ans){right++;ok=true;stat='right';}
    else {wrong++;stat='wrong';}
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+(i+1)+'</td><td class="imgcell"></td>'+
      '<td class="'+(ok?'':'bad')+'">'+(got||'未作答')+'</td><td class="ok">'+ans+'</td>'+
      '<td>'+(ok?'<span class="ok">&#10003;</span>':(stat==='blank'?'<span>—</span>':'<span class="bad">&#10007;</span>'))+'</td>';
    const im=document.createElement('img');im.style.height='42px';attachImg(im,q.item.img);tr.querySelector('.imgcell').appendChild(im);
    tb.appendChild(tr);
  });
  const per=2; let score=right*per - wrong*per - blank*per; if(score<0)score=0;
  document.getElementById('rName').textContent=document.getElementById('name').value||'考生';
  document.getElementById('rMode').textContent=MODE==='choice'?'選擇題':'填答題';
  document.getElementById('rScore').textContent=score;
  document.getElementById('rFull').textContent=quiz.length*per;
  document.getElementById('rRight').textContent=right;
  document.getElementById('rWrong').textContent=wrong;
  document.getElementById('rBlank').textContent=blank;
  show('resultView');
}
function show(id){['startView','quizView','resultView'].forEach(v=>document.getElementById(v).classList.toggle('hide',v!==id));}
document.getElementById('allBtn').onclick=()=>{document.querySelectorAll('#cats input').forEach(c=>c.checked=true);updateSel();};
document.getElementById('noneBtn').onclick=()=>{document.querySelectorAll('#cats input').forEach(c=>c.checked=false);updateSel();};
document.getElementById('startBtn').onclick=start;
document.getElementById('prevBtn').onclick=()=>{if(cur>0){cur--;render();}};
document.getElementById('nextBtn').onclick=()=>{if(cur<quiz.length-1){cur++;render();}};
document.getElementById('submitBtn').onclick=()=>{if(confirm('確定交卷？'))finish();};
document.getElementById('retryBtn').onclick=()=>show('startView');
document.getElementById('homeBtn').onclick=()=>{clearInterval(timer);show('startView');};
load();
</script>
</body>
</html>
